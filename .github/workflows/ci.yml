name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Test
        run: swift test
      - name: Build release
        run: swift build -c release
