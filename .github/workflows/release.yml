name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build universal executable
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Package
        run: |
          cp .build/apple/Products/Release/wetype-accent ./wetype-accent
          chmod +x ./wetype-accent
          codesign --force --sign - ./wetype-accent
          codesign --verify --strict --verbose=2 ./wetype-accent
          shasum -a 256 ./wetype-accent > wetype-accent.sha256
          ditto -c -k --keepParent ./wetype-accent wetype-accent-macos-universal.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" wetype-accent-macos-universal.zip wetype-accent.sha256 --generate-notes
